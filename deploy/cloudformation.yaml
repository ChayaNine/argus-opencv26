AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  ARGUS - autonomous gauge-reading rounds. OpenCV 5 (COOL) on a Graviton4 EC2 instance, Amazon Bedrock agent,
  CloudFront HTTPS, S3 evidence archive, CloudWatch logs/metrics/dashboard/alarms, SNS work-order dispatch, budget.

Parameters:
  CoolAmiId:
    Type: AWS::EC2::Image::Id
    Description: AMI ID of "Cloud Optimized OpenCV Library (COOL) for AWS Graviton4" in this region (subscribe in AWS Marketplace first).
  InstanceType:
    Type: String
    Default: c8g.xlarge
    AllowedValues: [c8g.large, c8g.xlarge, c8g.2xlarge, c8g.4xlarge, m8g.xlarge, m8g.2xlarge, m8g.4xlarge]
    Description: Graviton4 instance type (COOL Graviton4 supports c8g, m8g, r8g).
  AvailabilityZone:
    Type: AWS::EC2::AvailabilityZone::Name
    Description: An AZ that offers the instance type (deploy.sh picks one automatically).
  ArtifactBucket:
    Type: String
    Description: S3 bucket holding the application tarball (created by deploy.sh).
  ArtifactKey:
    Type: String
    Description: S3 key of the application tarball.
  EnableLlm:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
  BedrockModelId:
    Type: String
    Default: global.anthropic.claude-haiku-4-5-20251001-v1:0
    Description: Bedrock model or inference-profile ID used by the LLM inspector (Converse API with tool use).
  LlmDailyCap:
    Type: Number
    Default: 80
    Description: Maximum LLM rounds per day on the public endpoint (cost control).
  AlertEmail:
    Type: String
    Default: ""
    Description: Optional email for approved work orders, alarms and the budget (you must confirm the SNS subscription).
  MonthlyBudgetUsd:
    Type: Number
    Default: 60
  OriginSecret:
    Type: String
    NoEcho: true
    MinLength: 24
    Description: Shared secret CloudFront sends to the origin; requests without it are rejected (generated by deploy.sh).
  CloudFrontPrefixList:
    Type: String
    Default: ""
    Description: Optional managed prefix list ID for com.amazonaws.global.cloudfront.origin-facing (restricts port 8080 to CloudFront).

Conditions:
  HasEmail: !Not [!Equals [!Ref AlertEmail, ""]]
  HasPrefixList: !Not [!Equals [!Ref CloudFrontPrefixList, ""]]
  IsUsEast1: !Equals [!Ref "AWS::Region", us-east-1]

Resources:
  # ---------------------------------------------------------------- network
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags: [{Key: Name, Value: !Sub "${AWS::StackName}-vpc"}]
  Igw:
    Type: AWS::EC2::InternetGateway
  IgwAttach:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties: {VpcId: !Ref Vpc, InternetGatewayId: !Ref Igw}
  Subnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.1.0/24
      AvailabilityZone: !Ref AvailabilityZone
      MapPublicIpOnLaunch: true
      Tags: [{Key: Name, Value: !Sub "${AWS::StackName}-public"}]
  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties: {VpcId: !Ref Vpc}
  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: IgwAttach
    Properties: {RouteTableId: !Ref RouteTable, DestinationCidrBlock: 0.0.0.0/0, GatewayId: !Ref Igw}
  SubnetRoute:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref Subnet, RouteTableId: !Ref RouteTable}
  AppSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ARGUS origin. Port 8080 only; no SSH (use SSM Session Manager).
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - !If
          - HasPrefixList
          - {IpProtocol: tcp, FromPort: 8080, ToPort: 8080, SourcePrefixListId: !Ref CloudFrontPrefixList,
             Description: CloudFront origin-facing}
          - {IpProtocol: tcp, FromPort: 8080, ToPort: 8080, CidrIp: 0.0.0.0/0,
             Description: "Origin; requests without the CloudFront secret header are rejected by the app"}
      SecurityGroupEgress:
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: "HTTPS to AWS APIs, PyPI and apt"}
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0, Description: "apt mirrors"}
        - {IpProtocol: udp, FromPort: 123, ToPort: 123, CidrIp: 0.0.0.0/0, Description: "NTP"}

  # ---------------------------------------------------------------- storage, messaging, logs
  DataBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration: [{ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}}]
      PublicAccessBlockConfiguration:
        {BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true}
      OwnershipControls: {Rules: [{ObjectOwnership: BucketOwnerEnforced}]}
      LifecycleConfiguration:
        Rules:
          - {Id: expire-round-evidence, Status: Enabled, Prefix: rounds/, ExpirationInDays: 60}
  DataBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DataBucket
      PolicyDocument:
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt DataBucket.Arn, !Sub "${DataBucket.Arn}/*"]
            Condition: {Bool: {"aws:SecureTransport": "false"}}
  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${AWS::StackName}-work-orders"
      KmsMasterKeyId: alias/aws/sns
  AlertsEmail:
    Type: AWS::SNS::Subscription
    Condition: HasEmail
    Properties: {TopicArn: !Ref AlertsTopic, Protocol: email, Endpoint: !Ref AlertEmail}
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/argus/${AWS::StackName}"
      RetentionInDays: 30

  # ---------------------------------------------------------------- IAM (least privilege)
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{Effect: Allow, Principal: {Service: ec2.amazonaws.com}, Action: sts:AssumeRole}]
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: argus-runtime
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadAppArtifact
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:aws:s3:::${ArtifactBucket}/*"
              - Sid: EvidenceArchive
                Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub "${DataBucket.Arn}/*"
              - Sid: EvidenceList
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt DataBucket.Arn
              - Sid: BedrockInvoke
                Effect: Allow
                Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
                Resource:
                  - "arn:aws:bedrock:*::foundation-model/anthropic.*"
                  - "arn:aws:bedrock:*::foundation-model/amazon.nova*"
                  - !Sub "arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*"
              - Sid: Metrics
                Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: "*"
                Condition: {StringEquals: {"cloudwatch:namespace": ARGUS}}
              - Sid: TraceLogs
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "${LogGroup.Arn}:*"
              - Sid: DispatchWorkOrders
                Effect: Allow
                Action: sns:Publish
                Resource: !Ref AlertsTopic
  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties: {Roles: [!Ref InstanceRole]}

  # ---------------------------------------------------------------- compute (Graviton4 + COOL)
  AppInstance:
    Type: AWS::EC2::Instance
    DependsOn: DefaultRoute
    Properties:
      ImageId: !Ref CoolAmiId
      InstanceType: !Ref InstanceType
      SubnetId: !Ref Subnet
      SecurityGroupIds: [!Ref AppSg]
      IamInstanceProfile: !Ref InstanceProfile
      MetadataOptions: {HttpTokens: required, HttpPutResponseHopLimit: 2, HttpEndpoint: enabled}
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs: {VolumeSize: 30, VolumeType: gp3, Encrypted: true, DeleteOnTermination: true}
      Tags:
        - {Key: Name, Value: !Sub "${AWS::StackName}-cool-graviton4"}
        - {Key: Project, Value: ARGUS}
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          exec > /var/log/argus-userdata.log 2>&1
          set -x
          export DEBIAN_FRONTEND=noninteractive
          # SSM agent (Session Manager instead of SSH)
          snap list amazon-ssm-agent >/dev/null 2>&1 || snap install amazon-ssm-agent --classic || true
          systemctl enable --now snap.amazon-ssm-agent.amazon-ssm-agent.service || true
          mkdir -p /etc/argus
          cat > /etc/argus/argus.env <<'ENVEOF'
          AWS_REGION=${AWS::Region}
          AWS_DEFAULT_REGION=${AWS::Region}
          ARGUS_S3_BUCKET=${DataBucket}
          ARGUS_SNS_TOPIC_ARN=${AlertsTopic}
          ARGUS_CW_LOG_GROUP=${LogGroup}
          ARGUS_CW_NAMESPACE=ARGUS
          ARGUS_ORIGIN_SECRET=${OriginSecret}
          ARGUS_LLM_ENABLED=${EnableLlm}
          ARGUS_BEDROCK_MODEL=${BedrockModelId}
          ARGUS_LLM_DAILY_CAP=${LlmDailyCap}
          ARGUS_DATA_DIR=/var/lib/argus
          ARGUS_RESULTS_DIR=/opt/argus/results
          ENVEOF
          sed -i 's/^ *//' /etc/argus/argus.env
          chmod 640 /etc/argus/argus.env
          printf 'ARTIFACT_BUCKET=%s\nARTIFACT_KEY=%s\nAWS_REGION=%s\n' '${ArtifactBucket}' '${ArtifactKey}' '${AWS::Region}' > /etc/argus/artifact.env
          # a Python that can run boto3 to fetch the application (prefer COOL's venv)
          PY=""
          for c in /opt/cool/venvs/python_3.12/bin/python /opt/cool/venvs/python_3.11/bin/python /usr/bin/python3; do
            if [ -x "$c" ]; then PY="$c"; break; fi
          done
          "$PY" -m pip --version || "$PY" -m ensurepip || (apt-get update && apt-get install -y python3-pip)
          "$PY" -m pip install --quiet boto3==1.43.118 || "$PY" -m pip install --quiet --break-system-packages boto3==1.43.118
          "$PY" - <<'PYEOF'
          import boto3
          env = dict(l.strip().split("=", 1) for l in open("/etc/argus/artifact.env") if "=" in l)
          boto3.client("s3", region_name=env["AWS_REGION"]).download_file(env["ARTIFACT_BUCKET"], env["ARTIFACT_KEY"], "/tmp/argus.tgz")
          PYEOF
          rm -rf /opt/argus && mkdir -p /opt/argus && tar xzf /tmp/argus.tgz -C /opt/argus
          bash /opt/argus/deploy/bootstrap.sh
  AppEip:
    Type: AWS::EC2::EIP
    DependsOn: IgwAttach
    Properties: {Domain: vpc, InstanceId: !Ref AppInstance}

  # ---------------------------------------------------------------- HTTPS edge
  Cdn:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "ARGUS ${AWS::StackName}"
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Origins:
          - Id: argus-origin
            DomainName: !If
              - IsUsEast1
              - !Sub ["ec2-${Dashed}.compute-1.amazonaws.com", {Dashed: !Join ["-", !Split [".", !Ref AppEip]]}]
              - !Sub ["ec2-${Dashed}.${AWS::Region}.compute.amazonaws.com", {Dashed: !Join ["-", !Split [".", !Ref AppEip]]}]
            CustomOriginConfig:
              HTTPPort: 8080
              OriginProtocolPolicy: http-only
              OriginReadTimeout: 60
              OriginKeepaliveTimeout: 30
            OriginCustomHeaders:
              - {HeaderName: X-Origin-Verify, HeaderValue: !Ref OriginSecret}
        DefaultCacheBehavior:
          TargetOriginId: argus-origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad        # Managed-CachingDisabled
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # Managed-SecurityHeadersPolicy
        CacheBehaviors:
          - PathPattern: /static/*
            TargetOriginId: argus-origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6      # Managed-CachingOptimized
            ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03

  # ---------------------------------------------------------------- observability & cost control
  RecoverAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Recover the ARGUS instance if the system status check fails
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed_System
      Dimensions: [{Name: InstanceId, Value: !Ref AppInstance}]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions: [!Sub "arn:aws:automate:${AWS::Region}:ec2:recover", !Ref AlertsTopic]
  FallbackAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The LLM inspector is falling back to the policy agent (Bedrock access, throttling or errors)
      Namespace: ARGUS
      MetricName: LLMFallbacks
      Dimensions: [{Name: Agent, Value: llm}]
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]
  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "${AWS::StackName}-argus"
      DashboardBody: !Sub |
        {"widgets":[
          {"type":"metric","x":0,"y":0,"width":8,"height":6,"properties":{"title":"Rounds and gauges","region":"${AWS::Region}","stat":"Sum","period":3600,
            "metrics":[["ARGUS","RoundsCompleted","Agent","llm"],["...","policy"],["ARGUS","GaugesInspected","Agent","llm"],["...","policy"]]}},
          {"type":"metric","x":8,"y":0,"width":8,"height":6,"properties":{"title":"Automated vs escalated","region":"${AWS::Region}","stat":"Sum","period":3600,
            "metrics":[["ARGUS","AutomatedReadings","Agent","llm"],["...","policy"],["ARGUS","Escalations","Agent","llm"],["...","policy"],["ARGUS","WorkOrdersDrafted","Agent","llm"],["...","policy"]]}},
          {"type":"metric","x":16,"y":0,"width":8,"height":6,"properties":{"title":"OpenCV compute ms per gauge","region":"${AWS::Region}","stat":"Average","period":3600,
            "metrics":[["ARGUS","ComputeMsPerGauge","Agent","llm"],["...","policy"]]}},
          {"type":"metric","x":0,"y":6,"width":8,"height":6,"properties":{"title":"LLM calls and fallbacks","region":"${AWS::Region}","stat":"Sum","period":3600,
            "metrics":[["ARGUS","LLMCalls","Agent","llm"],["ARGUS","LLMFallbacks","Agent","llm"]]}},
          {"type":"metric","x":8,"y":6,"width":8,"height":6,"properties":{"title":"LLM cost (micro-USD)","region":"${AWS::Region}","stat":"Sum","period":3600,
            "metrics":[["ARGUS","LLMCostMicroUSD","Agent","llm"]]}},
          {"type":"metric","x":16,"y":6,"width":8,"height":6,"properties":{"title":"Instance CPU","region":"${AWS::Region}","stat":"Average","period":300,
            "metrics":[["AWS/EC2","CPUUtilization","InstanceId","${AppInstance}"]]}},
          {"type":"log","x":0,"y":12,"width":24,"height":8,"properties":{"title":"Agent decisions (trace)","region":"${AWS::Region}",
            "query":"SOURCE '${LogGroup}' | fields @timestamp, round_id, gauge_id, actor, kind, tool, text, error, limit_status | filter kind in ['thought','guard','fallback','tool_error','human_review','human_work_order'] | sort @timestamp desc | limit 200","view":"table"}}
        ]}
  Budget:
    Type: AWS::Budgets::Budget
    Condition: HasEmail
    Properties:
      Budget:
        BudgetName: !Sub "${AWS::StackName}-monthly"
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: {Amount: !Ref MonthlyBudgetUsd, Unit: USD}
      NotificationsWithSubscribers:
        - Notification: {NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 80, ThresholdType: PERCENTAGE}
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref AlertEmail}]
        - Notification: {NotificationType: FORECASTED, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE}
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref AlertEmail}]

Outputs:
  AppUrl:
    Value: !Sub "https://${Cdn.DomainName}"
    Description: Public HTTPS endpoint for judges
  InstanceId:
    Value: !Ref AppInstance
  InstanceProfileName:
    Value: !Ref InstanceProfile
  SubnetId:
    Value: !Ref Subnet
  SecurityGroupId:
    Value: !Ref AppSg
  DataBucket:
    Value: !Ref DataBucket
  LogGroup:
    Value: !Ref LogGroup
  TopicArn:
    Value: !Ref AlertsTopic
  DashboardUrl:
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${AWS::StackName}-argus"
  OriginIp:
    Value: !Ref AppEip
  DistributionId:
    Value: !Ref Cdn
